<style>

}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101715;--paper:#18211F;--ink:#E6ECE9;--muted:#9AA8A4;--line:#2B3633;--line2:#3A4743;--celadon:#5FB6A1;--celadon-dk:#3E8C79;--celadon-soft:#1C332E;--seal:#EF8570;--seal-dk:#B8604E;--seal-soft:#3A221D;--gold:#E0B85A;--gold-soft:#352E1C;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101715;--paper:#18211F;--ink:#E6ECE9;--muted:#9AA8A4;--line:#2B3633;--line2:#3A4743;--celadon:#5FB6A1;--celadon-dk:#3E8C79;--celadon-soft:#1C332E;--seal:#EF8570;--seal-dk:#B8604E;--seal-soft:#3A221D;--gold:#E0B85A;--gold-soft:#352E1C;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--f-body)}
button{font:inherit;color:inherit}

.screen{max-width:560px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column}
/* --- home --- */
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:14px 10px}

:root.kz[data-theme="dark"]{--celadon:#5CB8DB;--celadon-dk:#3B8FB0;--celadon-soft:#173140}
.langsw{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:10px}

function buildTasks(words,pool,lv){
  // words: focus words for this lesson
  var tasks=[], ws=shuffle(words);
  var types=lv===0?['ko2ru','pic','ru2ko','pairs','jamo','ko2ru','odd','listen','build','pic']
          :lv===1?['pic','ru2ko','jamo','listen','pairs','odd','type','build','dict','ru2ko']
                 :['build','type','dict','odd','jamo','ru2ko','pairs','pic','type','dict'];
  var i=0;
  types.forEach(function(tp){
    if(tp==='jamo'&&LANG!=='ko')tp='build';
    if(tp==='listen'&&!koVoice)tp='ru2ko';
    if(tp==='dict'&&!koVoice)tp='build';
    if(tp==='pairs'){tasks.push({t:'pairs',items:shuffle(ws).slice(0,5)});return}
    var w=ws[i%ws.length];i++;
    function need(f,fb){if(f(w))return;var alt=ws.find(f);if(alt)w=alt;else tp=fb}
    if(tp==='pic')need(function(x){return !!emo(x)},'ko2ru');
    if(tp==='jamo')need(function(x){return hangulOnly(x.ko)&&x.ko.indexOf(' ')<0&&x.ko.length<=3},'build');
    if(tp==='build'||tp==='type'||tp==='dict')need(function(x){return hangulOnly(x.ko)},'ru2ko');
    tasks.push({t:tp,w:w,pool:pool});
  });
  return tasks;
}

function lev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++)d[0][j]=j;
  for(i=1;i<=m;i++)for(j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function errFromKz(f){
  var words=f[1].split(' '),acc=[f[1]].concat(f[3]).map(norm),ds=shuffle(f[2]);
  for(var k=0;k<ds.length;k++){var d=ds[k],best=-1,bd=99;
    for(var i=0;i<words.length;i++){var w=words[i];if(w===d)continue;var dd=lev(w.toLowerCase(),d.toLowerCase());if(dd<bd&&dd<=Math.max(1,Math.floor(w.length/2))){bd=dd;best=i}}
    if(best>=0){var c=words.slice();c[best]=d;if(acc.indexOf(norm(c.join(' ')))<0)return {w:c,i:best,right:words[best],full:f[1],ru:f[0]}}}
  return null;
}

{id:"e15",s:"who / which",t:"Relative clauses",ru:"who, which, that, whose, where",les:"B2",

{id:"et3",s:"Learn",t:"Learning a language as an adult",ru:"Учить язык взрослым",th:"Учёба",
 sents:[["Many people believe that adults can't learn languages well.","Многие считают, что взрослые не могут хорошо выучить язык."],["Research shows that this is only partly true.","Исследования показывают, что это правда лишь отчасти."],["Children are better at copying sounds.","Дети лучше повторяют звуки."],["Adults, on the other hand, learn grammar faster.","Взрослые, напротив, быстрее учат грамматику."],["They can also use their experience and logic.","Они также могут опираться на опыт и логику."],["The real problem is usually time.","Настоящая проблема обычно во времени."],["Adults have jobs, families and a lot of stress.","У взрослых работа, семья и много стресса."],["Experts say that short daily practice works best.","Эксперты говорят, что лучше всего работает короткая ежедневная практика."],["Fifteen minutes every day is better than two hours on Sunday.","Пятнадцать минут каждый день лучше, чем два часа в воскресенье."],["It also helps to have a clear goal.","Ещё помогает чёткая цель."],["So don't give up!","Так что не сдавайся!"]],

function errFromEn(f){
  var words=f[1].split(' '),i=-1;
  for(var k=0;k<words.length;k++){if(words[k].replace(/[?.!,]/g,'')===f[2]){i=k;break}}
  if(i<0)return null;var c=words.slice();c[i]=f[3];
  return {w:c,i:i,right:words[i],full:f[1],ru:f[0]};
}
var EH=['twelve','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve'];
function enTime(h,m){
  var nx=h%12+1;
  if(m===0)return EH[h]+" o'clock";
  if(m===15)return 'quarter past '+EH[h];
  if(m===30)return 'half past '+EH[h];
  if(m===45)return 'quarter to '+EH[nx];
  var W={5:'five',10:'ten',20:'twenty',25:'twenty-five'};
  if(m<30)return W[m]+' past '+EH[h];
  return W[60-m]+' to '+EH[nx];
}

      var hh=function(h){return ((h-1+12)%12)+1},v2=[[T.h,T.m]];

    wireChoice(T.opts,function(o){return o[0]===T.h&&o[1]===T.m},function(ok){if(!ok)L.mist.push({ko:T.say,ru:f2([T.h,T.m])});feedback(ok,ok?'':f2([T.h,T.m]),esc(T.say)+' · past — после, to — без')});
  }

}
